<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root {
    --bg: #14171c; --surface: #1a1e25; --surface-2: #21262e; --surface-3: #2a303a;
    --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16);
    --text: #e9e7e2; --text-dim: #a7adb8; --text-faint: #71787f;
    --accent: #f2b155; --accent-strong: #f7c474; --accent-dim: rgba(242,177,85,0.13); --accent-line: rgba(242,177,85,0.45);
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 13px/1.5 var(--font); color: var(--text);
    background: radial-gradient(1200px 500px at 50% -10%, #1a1f27 0%, var(--bg) 55%);
    min-height: 100vh; user-select: none;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 6.5vh 24px 40px; text-align: center; }
  .mark { color: var(--accent); display: inline-flex; margin-bottom: 14px; }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: 0.01em; }
  .sub { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .idline { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; }
  .idline .mail { color: var(--accent-strong); font-weight: 600; }
  .idline.setup { cursor: pointer; border-color: var(--accent-line); background: var(--accent-dim); color: var(--accent-strong); font-weight: 600; }
  .idline.setup:hover { background: rgba(242,177,85,0.2); }

  .search { margin: 26px auto 8px; position: relative; }
  .search input {
    width: 100%; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
    background: var(--surface); color: var(--text); font: 14px var(--font); padding: 0 18px 0 44px;
    outline: none; transition: border-color .12s, box-shadow .12s;
  }
  .search input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-dim); background: var(--surface-2); }
  .search input::placeholder { color: var(--text-faint); }
  .search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  .links { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 24px 0 6px; }
  .link { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; border-radius: 10px; padding: 8px 2px; }
  .link:hover { background: var(--surface); }
  .link .tile {
    width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 650; color: var(--text-dim); transition: transform .1s, border-color .1s;
  }
  .link:hover .tile { transform: translateY(-2px); border-color: var(--border-strong); }
  .link.inbox .tile { color: var(--accent-strong); border-color: var(--accent-line); }
  .link span { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }

  h2 { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); margin: 26px 0 8px; font-weight: 650; }
  .recent { text-align: left; }
  .row { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .row:hover { background: var(--surface); }
  .row .t { color: var(--text); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .u { color: var(--text-faint); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .row .g { color: var(--text-faint); display: inline-flex; }
  .empty { color: var(--text-faint); font-size: 12px; text-align: center; padding: 10px 0; }
  .footnote { margin-top: 30px; color: #9199a4; font-size: 11px; }
  .footnote b { color: var(--text-dim); font-weight: 600; }
  svg { pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark" id="mark"></div>
  <h1 id="title">Workspace</h1>
  <div class="sub">One browser. Many clean rooms.</div>
  <div class="idline" id="idline"></div>

  <div class="search">
    <span class="ic" id="sic"></span>
    <input id="q" type="text" placeholder="Search the web or enter an address" spellcheck="false" autocomplete="off">
  </div>

  <div class="links" id="links"></div>
  <h2 id="recentTitle">Recent in this workspace</h2>
  <div class="recent" id="recent"></div>
  <div class="footnote">This workspace keeps <b>its own cookies, cache and storage</b> - nothing crosses over.</div>
</div>

<script>
const DATA = "__NTP_DATA__";

const LOGO = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2" fill="currentColor" stroke="none"/></svg>';
const SEARCH_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>';
const GLOBE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>';
const MAIL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg>';

const ENGINES = {
  google: ['Google', 'https://www.google.com/search?q='],
  duckduckgo: ['DuckDuckGo', 'https://duckduckgo.com/?q='],
  bing: ['Bing', 'https://www.bing.com/search?q=']
};
const act = (a) => { window.__phAction = a; };
const nav = (url) => act({ type: 'navigate', url });

document.getElementById('mark').innerHTML = LOGO;
document.getElementById('sic').innerHTML = SEARCH_IC;

const ws = DATA.ws || { num: '?', name: 'Workspace' };
document.getElementById('title').textContent = `Workspace ${ws.num}`;

const idline = document.getElementById('idline');
if (DATA.identity) {
  idline.classList.add('has');
  idline.innerHTML = `${MAIL}<span class="mail">${esc(DATA.identity.email)}</span><span style="color:var(--text-faint)">· ${esc(DATA.identity.provider || 'identity')}</span>`;
  idline.title = DATA.identity.email;
  idline.style.cursor = 'default';
} else {
  idline.classList.add('setup');
  idline.innerHTML = `${MAIL}<span>Set up an email for this workspace</span>`;
  idline.onclick = () => act({ type: 'wizard' });
}

const links = document.getElementById('links');
const items = [];
if (DATA.identity) items.push({ label: 'Inbox', tile: '@', cls: 'inbox', url: inboxFor(DATA.identity.email) });
items.push(
  { label: 'Google', tile: 'G', url: 'https://www.google.com/' },
  { label: 'YouTube', tile: 'Y', url: 'https://www.youtube.com/' },
  { label: 'GitHub', tile: 'H', url: 'https://github.com/' },
  { label: 'Reddit', tile: 'R', url: 'https://www.reddit.com/' },
  { label: 'Wikipedia', tile: 'W', url: 'https://www.wikipedia.org/' }
);
for (const it of items.slice(0, 6)) {
  const d = document.createElement('div');
  d.className = 'link' + (it.cls ? ' ' + it.cls : '');
  d.innerHTML = `<div class="tile">${it.tile}</div><span>${esc(it.label)}</span>`;
  d.onclick = () => nav(it.url);
  links.append(d);
}

function inboxFor(email) {
  const dom = (email.split('@')[1] || '').toLowerCase();
  if (/proton/i.test(dom)) return 'https://mail.proton.me';
  if (/tuta|tutanota/.test(dom)) return 'https://app.tuta.com';
  if (/mailfence/.test(dom)) return 'https://mailfence.com';
  if (/mail\.com|usa\.com|engineer\.com/.test(dom)) return 'https://www.mail.com';
  return 'https://' + dom;
}

const recent = document.getElementById('recent');
const hist = (DATA.history || []).filter(h => h.url && h.url.startsWith('http')).slice(0, 6);
document.getElementById('recentTitle').style.display = hist.length ? '' : 'none';
if (!hist.length) {
  recent.innerHTML = '<div class="empty">Pages you visit in this workspace show up here.</div>';
} else {
  for (const h of hist) {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = `<span class="g">${GLOBE}</span><span class="t">${esc(h.title || h.url)}</span><span class="u">${esc(host(h.url))}</span>`;
    d.onclick = () => nav(h.url);
    recent.append(d);
  }
}

const q = document.getElementById('q');
const [engName, engUrl] = ENGINES[DATA.engine] || ENGINES.google;
q.placeholder = `Search ${engName} or enter an address`;
q.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const v = q.value.trim();
  if (!v) return;
  if (/^(https?|pigeonhole):\/\//i.test(v)) return nav(v);
  if (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v) && !/\s/.test(v)) return nav('https://' + v);
  nav(engUrl + encodeURIComponent(v));
});
setTimeout(() => q.focus(), 60);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } }
</script>
</body>
</html>
