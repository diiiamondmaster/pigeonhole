<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Can't reach this page</title>
<style>
  :root {
    --bg: #14171c; --surface: #1a1e25; --surface-2: #21262e;
    --border: rgba(255,255,255,0.075); --border-strong: rgba(255,255,255,0.16);
    --text: #e9e7e2; --text-dim: #a7adb8; --text-faint: #71787f;
    --accent: #f2b155; --accent-strong: #f7c474; --accent-dim: rgba(242,177,85,0.13); --accent-line: rgba(242,177,85,0.45);
    --danger: #e2635b;
    --font: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 var(--font); color: var(--text); background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { max-width: 460px; padding: 32px; text-align: center; }
  .sign { width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 18px; background: var(--accent-dim);
    border: 1px solid var(--accent-line); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 17px; font-weight: 650; margin-bottom: 8px; }
  p { color: var(--text-dim); font-size: 12.5px; margin-bottom: 6px; }
  .url { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--text-faint);
    word-break: break-all; margin: 10px 0 4px; }
  .code { font-size: 10.5px; color: var(--text-faint); margin-bottom: 18px; }
  .row { display: flex; gap: 9px; justify-content: center; margin-top: 18px; }
  button { height: 34px; padding: 0 18px; border-radius: 8px; font: 600 12.5px var(--font); cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); }
  button:hover { background: var(--surface); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #2a1c06; }
  button.primary:hover { background: var(--accent-strong); }
  .note { margin-top: 22px; font-size: 11px; color: var(--text-faint); }
</style>
</head>
<body>
<div class="card">
  <div class="sign">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><line x1="12" y1="9.5" x2="12" y2="14"/><line x1="12" y1="16.8" x2="12" y2="17.2"/></svg>
  </div>
  <h1 id="title">This page could not be loaded</h1>
  <p id="desc">The site did not respond in time or refused the connection.</p>
  <div class="url" id="url"></div>
  <div class="code" id="code"></div>
  <div class="row">
    <button class="primary" id="retry">Try again</button>
    <button id="home">New tab page</button>
  </div>
  <div class="note" id="note">Tip: if you typed the address, check it for typos.</div>
</div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code') || '';
const desc = p.get('desc') || '';
const url = p.get('url') || '';

const MAP = {
  '-6': ['File not found', 'The file or address could not be found.'],
  '-7': ['Timed out', 'The site took too long to answer.'],
  '-21': ['Network changed', 'The connection switched networks mid-flight. Try again.'],
  '-100': ['Connection closed', 'The site closed the connection unexpectedly.'],
  '-101': ['Connection reset', 'The connection was reset while the page was loading.'],
  '-102': ['Server refused the connection', 'The server declined the connection. The site may be down or blocking this browser.'],
  '-105': ['Name not resolved', 'The domain name could not be found. Check the spelling or your network.'],
  '-106': ['Internet disconnected', 'This computer appears to be offline.'],
  '-109': ['Server unreachable', 'The server is unreachable right now.'],
  '-118': ['Timed out', 'The connection timed out before the page loaded.'],
  '-200': ['Certificate problem', 'The site\u2019s security certificate is not valid. Loading it is blocked to protect you.'],
  '-201': ['Certificate problem', 'The site\u2019s certificate has expired or is not trusted.'],
  '-501': ['Insecure connection', 'The site only offers an outdated, insecure connection type.']
};
const m = MAP[code];
if (m) { document.getElementById('title').textContent = m[0]; document.getElementById('desc').textContent = m[1]; }
else if (desc) { document.getElementById('desc').textContent = desc; }

document.getElementById('url').textContent = url.length > 72 ? url.slice(0, 72) + '…' : url;
document.getElementById('code').textContent = code ? 'Error ' + code : '';

document.getElementById('retry').onclick = () => { window.__phAction = { type: 'navigate', url: url }; };
document.getElementById('home').onclick = () => { window.__phAction = { type: 'newtab' }; };
</script>
</body>
</html>
