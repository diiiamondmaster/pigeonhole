<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Forums - join or sign in</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
  input { width: 100%; padding: 9px 10px; font-size: 14px; box-sizing: border-box; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 15px; background: #0e7490; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .hint { font-size: 12px; color: #666; }
</style>
</head>
<body>
  <h1 id="state">Sign in to Acme Forums</h1>

  <form id="login">
    <label for="em">Email address</label>
    <input id="em" name="email" type="email" autocomplete="email">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p class="hint">New here? <a href="#" id="toggle">Create an account</a></p>
  </form>

  <form id="register" style="display:none">
    <label for="rem">Email address</label>
    <input id="rem" name="regEmail" type="email">
    <label for="rpw">Choose a password</label>
    <input id="rpw" name="regPassword" type="password" autocomplete="new-password">
    <label for="rpw2">Repeat password</label>
    <input id="rpw2" name="regPasswordRepeat" type="password" autocomplete="new-password">
    <label for="nick">Display name</label>
    <input id="nick" name="displayName" type="text">
    <button type="submit">Create account</button>
  </form>

  <script>
    toggle.onclick = (e) => {
      e.preventDefault();
      login.style.display = login.style.display === 'none' ? '' : 'none';
      register.style.display = register.style.display === 'none' ? '' : 'none';
      state.textContent = register.style.display === 'none' ? 'Sign in to Acme Forums' : 'Join Acme Forums';
    };
    login.onsubmit = e => { e.preventDefault(); state.textContent = 'Signed in!'; login.style.display = 'none'; };
    register.onsubmit = e => { e.preventDefault(); state.textContent = 'Account created!'; register.style.display = 'none'; };
  </script>
</body>
</html>
