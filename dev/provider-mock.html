<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Provider - Create your mailbox</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
  input, select { width: 100%; padding: 9px 10px; font-size: 14px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 16px 0; font-size: 13px; }
  button[type=submit] { margin-top: 10px; padding: 11px 18px; font-size: 15px; background: #7c3aed; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .captcha-box { margin-top: 14px; padding: 14px; background: #f3f4f6; border-radius: 8px; font-size: 13px; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Create your free mailbox</h1>
  <p>2 minutes. No phone number required.</p>

  <form id="signup" action="/created" method="post">
    <label for="desired">Desired email address</label>
    <div class="row">
      <input id="emailLocal" name="desiredUsername" type="text" placeholder="yourname" autocomplete="off">
      <select id="domain" name="emailDomain">
        <option value="mockmail.com">@mockmail.com</option>
        <option value="mockbox.net">@mockbox.net</option>
      </select>
    </div>

    <div class="row">
      <div>
        <label for="fn">First name</label>
        <input id="fn" name="firstName" type="text">
      </div>
      <div>
        <label for="ln">Last name</label>
        <input id="ln" name="lastName" type="text">
      </div>
    </div>

    <label for="dob">Date of birth</label>
    <input id="dob" name="dateOfBirth" type="date">

    <label for="g">Gender</label>
    <select id="g" name="gender">
      <option value="">Choose</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="diverse">Diverse</option>
    </select>

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="new-password">
    <label for="pw2">Confirm password</label>
    <input id="pw2" name="passwordConfirm" type="password" autocomplete="new-password">

    <label for="sq">Security question answer</label>
    <select id="sqs" name="securityQuestion" style="margin-bottom:6px">
      <option>What was the name of your first pet?</option>
    </select>
    <input id="sq" name="securityAnswer" type="text">

    <div class="captcha-box">
      <label for="cap" style="margin-top:0">Captcha - type the word <b>boat</b></label>
      <input id="cap" name="captchaCode" type="text" placeholder="captcha">
    </div>

    <label class="check"><input type="checkbox" id="terms" name="acceptTerms"> I accept the Terms of Service and Privacy Policy</label>

    <button type="submit">Create account</button>
  </form>

  <script>
    document.getElementById('signup').addEventListener('submit', e => {
      e.preventDefault();
      document.body.innerHTML = '<h1>Welcome to your inbox!</h1><p>You are signed in as ' + emailLocal.value + '@' + domain.value + '</p>';
    });
  </script>
</body>
</html>
